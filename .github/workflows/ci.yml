name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/runtime-package-lock.json
            prototypes/insight-composer/package-lock.json
            services/workspace/package-lock.json
            services/glossary/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare desktop runtime
        run: |
          $env:CONTINUOUS_READER_BUILD_PYTHON = (Get-Command python).Source
          npm run desktop:prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check desktop and application tests
        run: |
          $env:CONTINUOUS_READER_PYTHON = (Resolve-Path .desktop/runtime/python/python.exe).Path
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate unsigned foundation inventory
        run: |
          node electron/build-update.mjs --baseline-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
