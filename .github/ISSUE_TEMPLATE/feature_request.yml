name: 功能建议
description: 说明使用场景和希望解决的问题
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: "请说明具体阅读或维护场景。"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有办法与其他方案
