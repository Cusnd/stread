name: 问题报告
description: 提供可复现的问题和必要环境信息
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿上传真实资料库、连接令牌或未脱敏日志。安全漏洞请使用 Security 页面中的私密报告入口。"
  - type: input
    id: version
    attributes:
      label: 版本与安装方式
      placeholder: "例如 0.1.3，Setup / Portable / 源码"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: "Windows 版本、架构；源码运行时补充 Node/Python 版本"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: "尽量使用合成资料，说明是否每次出现。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
